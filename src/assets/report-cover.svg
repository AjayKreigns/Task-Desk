      <rect width="184" height="129" rx="11" fill="#FFFFFF" stroke="#D5D1FF" stroke-width="1.3"/>
      <circle cx="25" cy="26" r="4" fill="#A39AF2"/>
      <rect x="43" y="22" width="46" height="8" rx="4" fill="#D5D2FA"/>
      <circle cx="25" cy="53" r="4" fill="#A39AF2"/><rect x="43" y="49" width="94" height="8" rx="4" fill="#D4D1FA"/>
      <circle cx="25" cy="79" r="4" fill="#A39AF2"/><rect x="43" y="75" width="81" height="8" rx="4" fill="#D4D1FA"/>
      <circle cx="25" cy="105" r="4" fill="#A39AF2"/><rect x="43" y="101" width="67" height="8" rx="4" fill="#D4D1FA"/>
    </g>
    <g transform="translate(796 695)">
      <rect width="180" height="144" rx="11" fill="#FFFFFF" stroke="#D5D1FF" stroke-width="1.3"/>
      <circle cx="22" cy="25" r="4" fill="#A39AF2"/>
      <rect x="40" y="21" width="36" height="8" rx="4" fill="#D5D2FA"/>
      <circle cx="22" cy="51" r="4" fill="#A39AF2"/><rect x="40" y="47" width="101" height="8" rx="4" fill="#D4D1FA"/>
      <circle cx="22" cy="77" r="4" fill="#A39AF2"/><rect x="40" y="73" width="78" height="8" rx="4" fill="#D4D1FA"/>
      <circle cx="22" cy="103" r="4" fill="#A39AF2"/><rect x="40" y="99" width="86" height="8" rx="4" fill="#D4D1FA"/>
    </g>
    <g transform="translate(997 695)">
      <rect width="162" height="145" rx="11" fill="#FFFFFF" stroke="#D5D1FF" stroke-width="1.3"/>
      <circle cx="22" cy="21" r="4" fill="#A39AF2"/><circle cx="34" cy="21" r="4" fill="#C0BAF8"/><circle cx="46" cy="21" r="4" fill="#D6D2FC"/>
      <circle cx="37" cy="69" r="13" fill="#D7D4FC"/>
      <rect x="25" y="92" width="12" height="28" fill="#A9A1EF"/>
      <rect x="47" y="80" width="12" height="40" fill="#9189E8"/>
      <rect x="69" y="63" width="12" height="57" fill="#B9B3F3"/>
      <rect x="91" y="79" width="12" height="41" fill="#9B94EA"/>
      <rect x="113" y="35" width="12" height="85" fill="#8D85E7"/>
    </g>

    <!-- Donut -->
    <g transform="translate(1288 715)">
      <circle cx="0" cy="0" r="87" fill="none" stroke="#B6B0EF" stroke-width="48" stroke-dasharray="94 20 89 20 93 20 93 20"/>
      <circle cx="0" cy="0" r="45" fill="#FFFFFF"/>
      <line x1="0" y1="-111" x2="0" y2="-45" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="79" y1="-79" x2="32" y2="-32" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="111" y1="0" x2="45" y2="0" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="79" y1="79" x2="32" y2="32" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="0" y1="111" x2="0" y2="45" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="-79" y1="79" x2="-32" y2="32" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="-111" y1="0" x2="-45" y2="0" stroke="#FFFFFF" stroke-width="2"/>
    </g>

    <!-- Bottom right note card -->
    <g transform="translate(1418 695)">
      <rect width="153" height="149" rx="11" fill="#FFFFFF" stroke="#D5D1FF" stroke-width="1.3"/>
      <circle cx="22" cy="22" r="4" fill="#8C82F6"/><circle cx="34" cy="22" r="4" fill="#B3ACFB"/><circle cx="46" cy="22" r="4" fill="#D2CEFF"/>
      <rect x="21" y="47" width="83" height="8" rx="4" fill="#D5D2FA"/>
      <rect x="21" y="72" width="78" height="8" rx="4" fill="#D5D2FA"/>
      <rect x="21" y="97" width="68" height="8" rx="4" fill="#D5D2FA"/>
      <rect x="21" y="122" width="62" height="8" rx="4" fill="#D5D2FA"/>
    </g>
  </g>

  <!-- Footer decoration -->
  <g id="footer-dots" fill="#B9B4FF" opacity="0.9">
    <!-- generated dot matrix -->
    <g transform="translate(8 1990)">
      <circle cx="0" cy="0" r="5"/><circle cx="22" cy="0" r="5"/><circle cx="44" cy="0" r="5"/><circle cx="66" cy="0" r="5"/><circle cx="88" cy="0" r="5"/><circle cx="110" cy="0" r="5"/><circle cx="132" cy="0" r="5"/><circle cx="154" cy="0" r="5"/><circle cx="176" cy="0" r="5"/><circle cx="198" cy="0" r="5"/>
      <circle cx="0" cy="20" r="5"/><circle cx="22" cy="20" r="5"/><circle cx="44" cy="20" r="5"/><circle cx="66" cy="20" r="5"/><circle cx="88" cy="20" r="5"/><circle cx="110" cy="20" r="5"/><circle cx="132" cy="20" r="5"/><circle cx="154" cy="20" r="5"/><circle cx="176" cy="20" r="4"/><circle cx="198" cy="20" r="3"/>
      <circle cx="0" cy="40" r="5"/><circle cx="22" cy="40" r="5"/><circle cx="44" cy="40" r="5"/><circle cx="66" cy="40" r="5"/><circle cx="88" cy="40" r="5"/><circle cx="110" cy="40" r="5"/><circle cx="132" cy="40" r="5"/><circle cx="154" cy="40" r="4"/><circle cx="176" cy="40" r="3"/>
      <circle cx="0" cy="60" r="5"/><circle cx="22" cy="60" r="5"/><circle cx="44" cy="60" r="5"/><circle cx="66" cy="60" r="5"/><circle cx="88" cy="60" r="5"/><circle cx="110" cy="60" r="5"/><circle cx="132" cy="60" r="4"/><circle cx="154" cy="60" r="3"/>
      <circle cx="0" cy="80" r="5"/><circle cx="22" cy="80" r="5"/><circle cx="44" cy="80" r="5"/><circle cx="66" cy="80" r="5"/><circle cx="88" cy="80" r="5"/><circle cx="110" cy="80" r="4"/><circle cx="132" cy="80" r="3"/>
      <circle cx="0" cy="100" r="5"/><circle cx="22" cy="100" r="5"/><circle cx="44" cy="100" r="5"/><circle cx="66" cy="100" r="5"/><circle cx="88" cy="100" r="4"/><circle cx="110" cy="100" r="3"/>
    </g>
  </g>

  <g id="footer-lines" fill="none" stroke="#E166D5" stroke-width="1" opacity="0.65">
    <line x1="1050" y1="2172" x2="1371" y2="1912"/>
    <line x1="1072" y1="2172" x2="1393" y2="1912"/>
    <line x1="1094" y1="2172" x2="1415" y2="1912"/>
    <line x1="1116" y1="2172" x2="1437" y2="1912"/>
    <line x1="1138" y1="2172" x2="1459" y2="1912"/>
    <line x1="1160" y1="2172" x2="1481" y2="1912"/>
    <line x1="1182" y1="2172" x2="1503" y2="1912"/>
    <line x1="1204" y1="2172" x2="1525" y2="1912"/>
  </g>
</svg>
