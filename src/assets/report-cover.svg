<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2172" viewBox="0 0 1536 2172" role="img" aria-labelledby="title desc">
  <title id="title">IFE Digital Marketing Report Cover</title>
  <desc id="desc">Editable vector cover template for web PDF export. Portrait A4 (1536 x 2172 = 1:1.414).</desc>

  <defs>
    <linearGradient id="sideGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7B2BE2"/>
      <stop offset="100%" stop-color="#25157A"/>
    </linearGradient>
    <linearGradient id="footerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#132B91"/>
      <stop offset="48%" stop-color="#6B16C9"/>
      <stop offset="100%" stop-color="#D10AA8"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5A11D5"/>
      <stop offset="100%" stop-color="#0A1C58"/>
    </linearGradient>
    <radialGradient id="logoSphere" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFF5ED"/>
      <stop offset="35%" stop-color="#FFB79E"/>
      <stop offset="100%" stop-color="#EA2A10"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#1B1450" flood-opacity="0.10"/>
    </filter>
    <clipPath id="chartClip">
      <rect x="846" y="267" width="505" height="385" rx="14"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1536" height="2172" fill="#FFFFFF"/>
  <rect x="0" y="0" width="53" height="1912" fill="url(#sideGrad)"/>
  <rect x="0" y="1912" width="1536" height="260" fill="url(#footerGrad)"/>

  <!-- Subtle white content panel -->
  <rect x="53" y="0" width="1483" height="1912" fill="#FFFFFF"/>

  <!-- Header logo (replaced at export time with the real logo.png) -->
  <g id="ife-logo" transform="translate(1218 55)">
    <g transform="translate(0 0)">
      <path d="M25 34 C10 26,10 6,26 0" fill="none" stroke="#EA1C0B" stroke-width="6" stroke-linecap="round"/>
      <circle cx="29" cy="21" r="19" fill="url(#logoSphere)"/>
      <rect x="9" y="44" width="32" height="101" fill="#E30613"/>
      <rect x="73" y="21" width="57" height="124" fill="#06134C"/>
      <rect x="96" y="65" width="34" height="23" fill="#FFFFFF"/>
      <rect x="157" y="21" width="57" height="124" fill="#E30613"/>
      <rect x="180" y="65" width="34" height="23" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Main copy -->
  <text id="brand-label" x="123" y="700" font-family="Arial, Helvetica, sans-serif" font-size="98" font-weight="700" fill="#07154A">IFE</text>
  <text id="report-title" x="123" y="800" font-family="Arial, Helvetica, sans-serif" font-size="83" font-weight="700" fill="url(#titleGrad)">Digital Marketing Report</text>
  <rect x="126" y="847" width="112" height="4" fill="#5616D5"/>

  <!-- Calendar icon -->
  <g id="calendar-icon" transform="translate(125 905)" fill="none" stroke="#5515D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="7" width="49" height="49" rx="7"/>
    <line x1="0" y1="22" x2="49" y2="22"/>
    <line x1="12" y1="0" x2="12" y2="14"/>
    <line x1="37" y1="0" x2="37" y2="14"/>
    <circle cx="13" cy="33" r="2.5" fill="#5515D4" stroke="none"/>
    <circle cx="25" cy="33" r="2.5" fill="#5515D4" stroke="none"/>
    <circle cx="37" cy="33" r="2.5" fill="#5515D4" stroke="none"/>
    <circle cx="13" cy="45" r="2.5" fill="#5515D4" stroke="none"/>
    <circle cx="25" cy="45" r="2.5" fill="#5515D4" stroke="none"/>
  </g>
  <text id="report-month" x="207" y="944" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#07154A">July 2026</text>

  <!-- Clock icon -->
  <g id="clock-icon" transform="translate(127 984)" fill="none" stroke="#5515D4" stroke-width="4">
    <circle cx="25" cy="25" r="24"/>
    <line x1="25" y1="25" x2="25" y2="9" stroke-linecap="round"/>
    <line x1="25" y1="25" x2="37" y2="32" stroke-linecap="round"/>
  </g>
  <text id="generated-date" x="208" y="1022" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#07154A">Generated: 29 July 2026</text>

  <!-- Right-side analytics artwork.
       Internal geometry is unchanged from the original landscape template; the
       group is translated and scaled so the cluster sits centred in the lower
       half of the portrait page. -->
  <g id="analytics-art" opacity="0.58" transform="translate(-476.3 869.2) scale(1.15)">
    <!-- Main chart card -->
    <rect x="820" y="266" width="529" height="405" rx="15" fill="#FFFFFF" stroke="#D8D4FF" stroke-width="1.4" filter="url(#softShadow)"/>
    <g clip-path="url(#chartClip)">
      <!-- Grid -->
      <g stroke="#E7E5FA" stroke-width="1">
        <line x1="854" y1="329" x2="1326" y2="329"/>
        <line x1="854" y1="398" x2="1326" y2="398"/>
        <line x1="854" y1="467" x2="1326" y2="467"/>
        <line x1="854" y1="536" x2="1326" y2="536"/>
        <line x1="854" y1="605" x2="1326" y2="605"/>
        <line x1="876" y1="295" x2="876" y2="630"/>
        <line x1="942" y1="295" x2="942" y2="630"/>
        <line x1="1008" y1="295" x2="1008" y2="630"/>
        <line x1="1074" y1="295" x2="1074" y2="630"/>
        <line x1="1140" y1="295" x2="1140" y2="630"/>
        <line x1="1206" y1="295" x2="1206" y2="630"/>
        <line x1="1272" y1="295" x2="1272" y2="630"/>
      </g>
      <!-- Line -->
      <polyline points="844,626 876,583 900,586 958,513 1008,531 1066,461 1124,478 1189,400 1253,402 1322,322"
                fill="none" stroke="#7455FF" stroke-width="3"/>
      <g fill="#7A63EE">
        <circle cx="876" cy="583" r="7"/><circle cx="900" cy="586" r="7"/>
        <circle cx="958" cy="513" r="7"/><circle cx="1008" cy="531" r="7"/>
        <circle cx="1066" cy="461" r="7"/><circle cx="1124" cy="478" r="7"/>
        <circle cx="1189" cy="400" r="7"/><circle cx="1253" cy="402" r="7"/>
        <circle cx="1322" cy="322" r="7"/>
      </g>
      <g fill="#7668E8" font-family="Arial, Helvetica, sans-serif" font-size="12">
        <text x="862" y="656">Jan</text><text x="903" y="656">Feb</text>
        <text x="950" y="656">Mar</text><text x="1000" y="656">Apr</text>
        <text x="1054" y="656">May</text><text x="1111" y="656">Jun</text>
        <text x="1171" y="656">Jul</text>
      </g>
    </g>

    <!-- Small left list card -->
    <g transform="translate(675 474)">
      <rect width="169" height="195" rx="12" fill="#FFFFFF" stroke="#CFCBFF" stroke-width="1.4"/>
      <circle cx="22" cy="22" r="4" fill="#8A7FF4"/>
      <circle cx="33" cy="22" r="4" fill="#B6AFFA"/>
      <circle cx="44" cy="22" r="4" fill="#D1CCFF"/>
      <circle cx="26" cy="50" r="5" fill="#B7B0FA"/>
      <rect x="44" y="45" width="92" height="10" rx="5" fill="#D6D2FB"/>
      <rect x="44" y="78" width="89" height="9" rx="4.5" fill="#DAD7FC"/>
      <rect x="44" y="111" width="63" height="9" rx="4.5" fill="#DAD7FC"/>
      <rect x="44" y="144" width="87" height="9" rx="4.5" fill="#DAD7FC"/>
    </g>

    <!-- Top right note card -->
    <g transform="translate(1362 253) rotate(-9)">
      <rect width="171" height="178" rx="12" fill="#FFFFFF" stroke="#D5D1FF" stroke-width="1.4"/>
      <circle cx="21" cy="22" r="4" fill="#8C82F6"/>
      <circle cx="34" cy="22" r="4" fill="#B3ACFB"/>
      <circle cx="47" cy="22" r="4" fill="#D2CEFF"/>
      <rect x="22" y="48" width="139" height="12" rx="5" fill="#C8C3F8"/>
      <rect x="22" y="79" width="132" height="12" rx="5" fill="#D8D5FA"/>
      <rect x="22" y="111" width="100" height="12" rx="5" fill="#D8D5FA"/>
      <rect x="22" y="143" width="119" height="12" rx="5" fill="#D8D5FA"/>
    </g>

    <!-- Bar chart -->
    <g transform="translate(1358 443)">
      <rect x="0" y="95" width="21" height="112" fill="#AEA8EF"/>
      <rect x="34" y="112" width="21" height="95" fill="#BEB9F3"/>
      <rect x="68" y="44" width="21" height="163" fill="#A8A1EE"/>
      <rect x="102" y="74" width="21" height="133" fill="#9790E8"/>
      <rect x="136" y="0" width="21" height="207" fill="#8C84E6"/>
